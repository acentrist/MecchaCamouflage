name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    if: github.event_name != 'pull_request' || github.head_ref != 'rewrite/ue4ss-v2'
    runs-on: windows-2022
    env:
      BUILD_VERSION: ci-${{ github.run_number }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build runtime
        shell: powershell
        run: .\scripts\build.ps1 -Version $env:BUILD_VERSION

      - name: Build artifact checks
        shell: powershell
        run: |
          if (-not (Test-Path ".build/bin/meccha-camouflage.exe")) { throw "runtime exe missing" }
          $nativeDir = ".build/obj/$env:BUILD_VERSION/package-native"
          if (-not (Test-Path "$nativeDir/runtime-bridge.dll")) { throw "runtime bridge dll missing" }
          if (-not (Test-Path "$nativeDir/runtime-injector.exe")) { throw "runtime injector exe missing" }
          if (Test-Path "$nativeDir/bridge-loader.dll") { throw "bridge loader must not be packaged" }
          if (Test-Path "src/native/loader/loader.cpp") { throw "obsolete loader source must not return" }
          if (Test-Path "src/native/include/bridge_loader_abi.hpp") { throw "obsolete loader ABI must not return" }

      - name: Package dry run
        shell: powershell
        run: |
          .\scripts\release.ps1 -Version $env:BUILD_VERSION
          $exePath = ".build/package/meccha-camouflage-$($env:BUILD_VERSION).exe"
          if (-not (Test-Path $exePath)) { throw "package exe missing" }
          if ((Get-Item $exePath).Length -le 10000000) { throw "package exe is unexpectedly small" }
