name: V2 Secret-free CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  V2_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  policy-contracts:
    name: Policy Contracts
    runs-on: ubuntu-24.04
    outputs:
      run_heavy: ${{ steps.change-policy.outputs.run_heavy }}
      classification: ${{ steps.change-policy.outputs.classification }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V2_SOURCE_COMMIT }}
          fetch-depth: 0
          submodules: false

      - name: Classify the latest pull-request update
        id: change-policy
        env:
          V2_EVENT_NAME: ${{ github.event_name }}
          V2_EVENT_ACTION: ${{ github.event.action }}
          V2_BEFORE_COMMIT: ${{ github.event.before }}
        run: >
          python3 tools/v2/ci_change_policy.py
          --event-name "$V2_EVENT_NAME"
          --event-action "$V2_EVENT_ACTION"
          --before "$V2_BEFORE_COMMIT"
          --after "$V2_SOURCE_COMMIT"
          --repository "$GITHUB_REPOSITORY"
          --api-url "$GITHUB_API_URL"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify frozen-v1 and traceability contracts
        run: python3 tools/v2/verify_phase1.py

      - name: Verify CI trust and execution policy
        run: python3 tools/v2/verify_ci_policy.py

  linux-static-analysis:
    needs: policy-contracts
    if: needs.policy-contracts.outputs.run_heavy == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout without restricted dependencies
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V2_SOURCE_COMMIT }}
          submodules: false

      - name: Checkout the public UE4SS root only
        run: git submodule update --init third_party/RE-UE4SS

      - name: Configure secret-free GCC analysis
        run: >
          cmake -S . -B .build/v2/ci-linux-analyzer -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMECCHA_WITH_UE4SS=OFF
          -DMECCHA_BUILD_TESTS=OFF
          -DMECCHA_WARNINGS_AS_ERRORS=ON
          -DMECCHA_ENABLE_GCC_ANALYZER=ON

      - name: Analyze portable production targets
        run: >
          cmake --build .build/v2/ci-linux-analyzer
          --target meccha_product_ui meccha_runtime_contracts
          meccha_launcher_core --parallel 2

  linux-sanitizers:
    needs: policy-contracts
    if: needs.policy-contracts.outputs.run_heavy == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout without restricted dependencies
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V2_SOURCE_COMMIT }}
          submodules: false

      - name: Checkout the public UE4SS root only
        run: git submodule update --init third_party/RE-UE4SS

      - name: Configure sanitized secret-free graph
        run: >
          cmake -S . -B .build/v2/ci-linux-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMECCHA_WITH_UE4SS=OFF
          -DMECCHA_BUILD_TESTS=ON
          -DMECCHA_WARNINGS_AS_ERRORS=ON
          -DMECCHA_ENABLE_SANITIZERS=ON

      - name: Build sanitized secret-free graph
        run: cmake --build .build/v2/ci-linux-sanitized

      - name: Test sanitized secret-free graph
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >
          ctest --test-dir .build/v2/ci-linux-sanitized
          --output-on-failure

  windows:
    needs: policy-contracts
    if: needs.policy-contracts.outputs.run_heavy == 'true'
    runs-on: windows-2022

    steps:
      - name: Checkout without restricted dependencies
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V2_SOURCE_COMMIT }}
          submodules: false

      - name: Checkout the public UE4SS root only
        shell: powershell
        run: |
          git submodule update --init third_party/RE-UE4SS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure secret-free graph
        shell: powershell
        run: >
          cmake -S . -B .build/v2/ci-windows
          -G "Visual Studio 17 2022" -A x64
          -DMECCHA_WITH_UE4SS=OFF
          -DMECCHA_BUILD_TESTS=ON
          -DMECCHA_WARNINGS_AS_ERRORS=ON

      - name: Build secret-free graph
        shell: powershell
        run: cmake --build .build/v2/ci-windows --config Release

      - name: Test secret-free graph
        shell: powershell
        run: >
          ctest --test-dir .build/v2/ci-windows
          -C Release --output-on-failure

  public-ci:
    name: Public CI Gate
    if: always()
    needs:
      - policy-contracts
      - linux-static-analysis
      - linux-sanitizers
      - windows
    runs-on: ubuntu-24.04

    steps:
      - name: Require the selected public CI depth
        env:
          POLICY_RESULT: ${{ needs.policy-contracts.result }}
          RUN_HEAVY: ${{ needs.policy-contracts.outputs.run_heavy }}
          ANALYZER_RESULT: ${{ needs.linux-static-analysis.result }}
          SANITIZER_RESULT: ${{ needs.linux-sanitizers.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          if [[ "$POLICY_RESULT" != "success" ]]; then
            echo "Policy contracts did not succeed: $POLICY_RESULT"
            exit 1
          fi

          if [[ "$RUN_HEAVY" == "true" ]]; then
            if [[ "$ANALYZER_RESULT" != "success" ||
                  "$SANITIZER_RESULT" != "success" ||
                  "$WINDOWS_RESULT" != "success" ]]; then
              echo "Heavy CI did not succeed: analyzer=$ANALYZER_RESULT sanitizer=$SANITIZER_RESULT windows=$WINDOWS_RESULT"
              exit 1
            fi
          elif [[ "$RUN_HEAVY" == "false" ]]; then
            if [[ "$ANALYZER_RESULT" != "skipped" ||
                  "$SANITIZER_RESULT" != "skipped" ||
                  "$WINDOWS_RESULT" != "skipped" ]]; then
              echo "Lightweight CI unexpectedly ran a heavy job"
              exit 1
            fi
          else
            echo "Policy contracts returned an invalid run_heavy value: $RUN_HEAVY"
            exit 1
          fi
