name: V2 Trusted Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc-asan:
    name: Pre-release MSVC ASan
    runs-on: windows-2022

    steps:
      - name: Checkout reviewed ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout the public UE4SS root only
        run: git submodule update --init third_party/RE-UE4SS

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure AddressSanitizer graph
        run: >
          cmake -S . -B .build/v2/release-msvc-asan
          -G "Visual Studio 17 2022" -A x64
          -DMECCHA_WITH_UE4SS=OFF
          -DMECCHA_BUILD_TESTS=ON
          -DMECCHA_WARNINGS_AS_ERRORS=ON
          -DMECCHA_ENABLE_MSVC_ADDRESS_SANITIZER=ON

      - name: Build AddressSanitizer graph
        run: cmake --build .build/v2/release-msvc-asan --config Release

      - name: Test AddressSanitizer graph
        env:
          ASAN_OPTIONS: halt_on_error=1
        run: >
          ctest --test-dir .build/v2/release-msvc-asan
          -C Release --output-on-failure

  windows-clang-ubsan:
    name: Pre-release clang-cl UBSan
    runs-on: windows-2022

    steps:
      - name: Checkout reviewed ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout the public UE4SS root only
        run: git submodule update --init third_party/RE-UE4SS

      - name: Set up the MSVC SDK environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Report clang-cl version
        run: clang-cl --version

      - name: Configure UndefinedBehaviorSanitizer graph
        run: >
          cmake -S . -B .build/v2/release-clang-ubsan -G Ninja
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=Release
          -DMECCHA_WITH_UE4SS=OFF
          -DMECCHA_BUILD_TESTS=ON
          -DMECCHA_WARNINGS_AS_ERRORS=ON
          -DMECCHA_ENABLE_CLANG_CL_UBSAN=ON

      - name: Build UndefinedBehaviorSanitizer graph
        run: cmake --build .build/v2/release-clang-ubsan --parallel 2

      - name: Test UndefinedBehaviorSanitizer graph
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >
          ctest --test-dir .build/v2/release-clang-ubsan
          --output-on-failure

  windows-msvc-analysis:
    name: Pre-release MSVC Code Analysis
    runs-on: windows-2022

    steps:
      - name: Checkout reviewed ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout the public UE4SS root only
        run: git submodule update --init third_party/RE-UE4SS

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure native code analysis
        run: >
          cmake -S . -B .build/v2/release-msvc-analysis
          -G "Visual Studio 17 2022" -A x64
          -DMECCHA_WITH_UE4SS=OFF
          -DMECCHA_BUILD_TESTS=OFF
          -DMECCHA_WARNINGS_AS_ERRORS=ON
          -DMECCHA_ENABLE_MSVC_CODE_ANALYSIS=ON

      - name: Analyze production target closure
        run: >
          cmake --build .build/v2/release-msvc-analysis
          --config Release
          --target meccha_product_ui meccha_runtime_contracts
          meccha_launcher_core --parallel 2

  release-candidate:
    needs:
      - windows-msvc-asan
      - windows-clang-ubsan
      - windows-msvc-analysis
    if: >-
      github.repository == 'acentrist/MecchaCamouflage' &&
      (github.ref == 'refs/heads/rewrite/ue4ss-v2' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v2.'))
    environment: ue4ss-full-build
    runs-on: windows-2022

    steps:
      - name: Checkout reviewed ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Require reviewed dependency license audit
        shell: powershell
        run: |
          $Audit = "docs\v2\approved-dependency-license-audit.json"
          if (-not (Test-Path -LiteralPath $Audit -PathType Leaf)) {
            throw "The reviewed protected dependency license audit is not committed."
          }

      - name: Checkout complete pinned UE4SS graph
        shell: powershell
        env:
          UE4SS_GITHUB_TOKEN: ${{ secrets.UE4SS_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UE4SS_GITHUB_TOKEN)) {
            throw "UE4SS_GITHUB_TOKEN is required for the protected release build."
          }
          git -c "url.https://x-access-token:$env:UE4SS_GITHUB_TOKEN@github.com/.insteadOf=git@github.com:" submodule update --init --recursive third_party/RE-UE4SS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/v2/verify_source_graph.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/v2/prepare_ue4ss_source_stage.py `
            --policy cmake\ue4ss-source-overlay.json `
            --source-root third_party\RE-UE4SS `
            --output-root .build\v2\ue4ss-source `
            --manifest .build\v2\ue4ss-source-stage.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure trusted graph
        shell: powershell
        run: |
          $SourceRoot = (Resolve-Path .build\v2\ue4ss-source).Path
          $SourceManifest = (Resolve-Path .build\v2\ue4ss-source-stage.json).Path
          cmake --preset full-windows `
            "-DMECCHA_UE4SS_SOURCE_ROOT=$SourceRoot" `
            "-DMECCHA_UE4SS_SOURCE_MANIFEST=$SourceManifest"

      - name: Build runtime, proxy, mod, and contracts
        shell: powershell
        run: |
          cmake --build --preset full-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/v2/prepare_ue4ss_source_stage.py `
            --verify-only `
            --policy cmake\ue4ss-source-overlay.json `
            --output-root .build\v2\ue4ss-source `
            --manifest .build\v2\ue4ss-source-stage.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble and verify exact release candidate
        shell: powershell
        run: >
          .\tools\v2\build-release-candidate.ps1
          -ProjectRoot .
          -BuildRoot .build\v2\full-windows
          -Ue4ssSourceRoot .build\v2\ue4ss-source
          -Ue4ssSourceManifest .build\v2\ue4ss-source-stage.json
          -ProjectCommit ${{ github.sha }}
          -ApprovedLicenseAudit docs\v2\approved-dependency-license-audit.json
          -ReleaseRoot .build\v2\release-candidate

      - name: Upload exact release bytes
        uses: actions/upload-artifact@v4
        with:
          name: meccha-camouflage-v2.0.0-candidate
          path: |
            .build/v2/release-candidate/artifact/meccha-camouflage-v2.0.0.exe
            .build/v2/release-candidate/evidence/meccha-camouflage-v2.0.0.exe.sha256
          if-no-files-found: error

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: meccha-camouflage-v2.0.0-evidence
          path: .build/v2/release-candidate/evidence
          if-no-files-found: error
