name: V2 Trusted Full Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-build:
    if: >-
      github.repository == 'acentrist/MecchaCamouflage' &&
      (github.ref == 'refs/heads/rewrite/ue4ss-v2' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v2.'))
    environment: ue4ss-full-build
    runs-on: windows-2022

    steps:
      - name: Checkout reviewed ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Checkout complete pinned UE4SS graph
        shell: powershell
        env:
          UE4SS_GITHUB_TOKEN: ${{ secrets.UE4SS_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UE4SS_GITHUB_TOKEN)) {
            throw "UE4SS_GITHUB_TOKEN is required for the protected full build."
          }
          git -c "url.https://x-access-token:$env:UE4SS_GITHUB_TOKEN@github.com/.insteadOf=git@github.com:" submodule update --init --recursive third_party/RE-UE4SS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/v2/verify_source_graph.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/v2/prepare_ue4ss_source_stage.py `
            --policy cmake\ue4ss-source-overlay.json `
            --source-root third_party\RE-UE4SS `
            --output-root .build\v2\ue4ss-source `
            --manifest .build\v2\ue4ss-source-stage.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure trusted graph
        shell: powershell
        run: |
          $SourceRoot = (Resolve-Path .build\v2\ue4ss-source).Path
          $SourceManifest = (Resolve-Path .build\v2\ue4ss-source-stage.json).Path
          cmake --preset full-windows `
            "-DMECCHA_UE4SS_SOURCE_ROOT=$SourceRoot" `
            "-DMECCHA_UE4SS_SOURCE_MANIFEST=$SourceManifest"

      - name: Build UE4SS and mod together
        shell: powershell
        run: |
          cmake --build --preset full-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/v2/prepare_ue4ss_source_stage.py `
            --verify-only `
            --policy cmake\ue4ss-source-overlay.json `
            --output-root .build\v2\ue4ss-source `
            --manifest .build\v2\ue4ss-source-stage.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify full-build binaries and provenance
        shell: powershell
        run: >
          .\tools\v2\verify-full-build.ps1
          -BuildRoot .build\v2\full-windows
          -ReportPath .build\v2\full-windows\phase2-provenance.json
          -Ue4ssSourceRoot .build\v2\ue4ss-source
          -Ue4ssSourceManifest .build\v2\ue4ss-source-stage.json
          -ProjectCommit ${{ github.sha }}

      - name: Collect resolved dependency evidence
        shell: powershell
        run: |
          $CargoRoot = if ($env:CARGO_HOME) {
            $env:CARGO_HOME
          } else {
            Join-Path $env:USERPROFILE ".cargo"
          }
          $Metadata = ".build\v2\full-windows\patternsleuth-cargo-metadata.json"
          $CargoJson = cargo metadata `
            --locked `
            --offline `
            --filter-platform x86_64-pc-windows-msvc `
            --format-version 1 `
            --manifest-path .build\v2\ue4ss-source\deps\first\patternsleuth_bind\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [System.IO.File]::WriteAllText(
            $Metadata,
            ($CargoJson -join [Environment]::NewLine),
            [System.Text.UTF8Encoding]::new($false)
          )
          python tools\v2\collect_dependency_evidence.py `
            --project-root . `
            --build-root .build\v2\full-windows `
            --cargo-root $CargoRoot `
            --reply-directory .build\v2\full-windows\.cmake\api\v1\reply `
            --configuration Game__Shipping__Win64 `
            --root-target meccha_mod `
            --root-target proxy `
            --root-target UE4SS `
            --cargo-metadata $Metadata `
            --cargo-lock .build\v2\ue4ss-source\deps\first\patternsleuth_bind\Cargo.lock `
            --ue4ss-source-root .build\v2\ue4ss-source `
            --ue4ss-source-manifest .build\v2\ue4ss-source-stage.json `
            --cargo-root-package patternsleuth_bind `
            --ue4ss-commit 6c26f038751b3d96059d4a9148f5d093012d55ad `
            --output .build\v2\full-windows\dependency-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools\v2\generate_dependency_audit_template.py `
            --evidence .build\v2\full-windows\dependency-evidence.json `
            --output .build\v2\full-windows\dependency-audit-template.json `
            --ue4ss-commit 6c26f038751b3d96059d4a9148f5d093012d55ad
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test project contracts
        shell: powershell
        run: >
          ctest --test-dir .build/v2/full-windows
          --output-on-failure

      - name: Upload protected build evidence
        uses: actions/upload-artifact@v4
        with:
          name: v2-phase2-provenance
          path: |
            .build/v2/full-windows/phase2-provenance.json
            .build/v2/ue4ss-source-stage.json
            .build/v2/full-windows/dependency-evidence.json
            .build/v2/full-windows/dependency-audit-template.json
          if-no-files-found: error
