name: Bug report
description: Report a reproducible problem with MecchaCamouflage
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please search existing issues and test the latest release before submitting.

  - type: dropdown
    id: feature
    attributes:
      label: Affected feature
      multiple: true
      options:
        - Paint
        - Preview
        - Image Paint
        - ESP
        - User interface
        - Startup or connection
        - Other
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: MecchaCamouflage version
      description: The version shown in the application or release name.
      placeholder: "v1.7.1"
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: Game version
      description: Enter the game version shown by your installation.
      placeholder: "3.3.0"
    validations:
      required: true

  - type: dropdown
    id: official-steam-version
    attributes:
      label: Are you using the latest official Steam version of the game?
      options:
        - "Yes"
        - "No"
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: game-mode
    attributes:
      label: Game mode
      multiple: true
      options:
        - Basic Mode
        - Infection Mode
        - Double Mode
        - Reverse Chicken Mode
        - Not applicable
        - Unsure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the exact settings and actions that trigger the problem.
      placeholder: |
        1. Open ...
        2. Set ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exact error message if one appeared.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Complete logs
      description: Drag and drop the complete log file here. A single error line is usually not enough to diagnose the problem.
      placeholder: Drag and drop the complete log file here.
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Add screenshots or a short video if the problem is visual.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for the same problem.
          required: true
        - label: I tested the latest available MecchaCamouflage release.
          required: true
        - label: I attached the complete log file.
          required: true
